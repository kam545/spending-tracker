<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clean practice data</title><link rel="stylesheet" href="../style.css"></head><body><main>
<nav><a href="../index.html">Spending tracker</a><a href="clean.html">Clean practice data</a><a href="tests.html">Validation tests</a></nav>
<h1>Every row accounted for.</h1><p class="intro">Choose the original practice raw.csv. Review the decisions, then download the clean copy. This cleaner uses decisions specific to that file and a fixed review date of November 4, 2026.</p>
<div class="actions"><button id="run">Run cleaning</button><button id="download" disabled>Download clean.csv</button><input id="file" type="file" accept=".csv,text/csv" hidden aria-label="Choose raw CSV"></div>
<p id="status" aria-live="polite"></p><div id="results"></div>
<script src="schema.js"></script><script src="csv.js"></script><script src="validate.js"></script><script src="clean.js"></script><script src="ui.js"></script><script>
let cleanedCSV = '';
document.getElementById('run').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = async event => {
 const file = event.target.files[0]; if (!file) return;
 document.getElementById('download').disabled = true;
 document.getElementById('results').replaceChildren();
 try {
  const rows = parseCSV(await file.text()); const result = cleanRows(rows); const passed = checkRowCounts(rows, result);
  document.getElementById('status').textContent = (passed ? 'PASS — ' : 'FAIL — ') + (rows.length - 1) + ' raw rows = ' + result.clean.length + ' clean + ' + result.removed.length + ' removed + ' + result.review.length + ' set aside.';
  for (const [key, title] of [['clean','Clean rows'],['removed','Removed rows'],['review','Set aside for review']]) {
   const section = document.createElement('section'); section.className = 'card'; const heading = document.createElement('h2'); heading.textContent = title; section.append(heading);
   const table = document.createElement('div'); table.className = 'scroll'; section.append(table);
   showTable(table, ['Source row', ...SCHEMA.columns, 'Reason / flag'], result[key].map(row => [row.source_row, ...row.values, row.reasons.join(' ')])); document.getElementById('results').append(section);
  }
  cleanedCSV = toCSV([SCHEMA.columns, ...result.clean.map(row => row.values)]); document.getElementById('download').disabled = !passed;
 } catch (error) { document.getElementById('status').textContent = error.message; }
 event.target.value = '';
};
document.getElementById('download').onclick = () => downloadCSV(cleanedCSV);
</script></main></body></html>
