<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validation tests</title><link rel="stylesheet" href="../style.css"></head><body><main><nav><a href="../index.html">Spending tracker</a><a href="clean.html">Clean practice data</a><a href="tests.html">Validation tests</a></nav><h1>Check the rules.</h1><p>Tests use November 4, 2026 as today so results stay consistent.</p><h2 id="summary"></h2><ol id="tests"></ol>
